name: tests

on:
  push:
    branches: [main]
  pull_request:

# Changes arrive as pull requests: a pull request's branch is tested once, through its pull_request run, and a newer
# commit on it cancels the older run. Each push to main is its own group, so a waiting run is never replaced by a
# later push (a group keeps one pending run). Tags are not tested again: they mark commits main has tested.
concurrency:
  group: tests-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.13"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.13"
    steps:
      # Each action by its commit, so a tag moved later cannot change what runs here (found by the security audit of
      # 0.5, L09). The releases those commits are: checkout v7.0.1, setup-python v7.1.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install FluidSynth and FFmpeg (Ubuntu)
        if: runner.os == 'Linux'
        # Without the recommended packages (qsynth, video drivers, a speech model and other extras the tests never use,
        # which also brought in the large General MIDI bank fluid-soundfont-gm) the download is 70 MB instead of 248 MB,
        # normally a few seconds. A slow mirror still stalls some downloads, so the packages are fetched first, each
        # attempt for at most four minutes, a stalled one starting again where it stopped; only then are they installed,
        # so dpkg is never cut off half way. The step stops after 15 minutes in all.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          for attempt in 1 2 3; do
            timeout 240 sudo apt-get install -y --no-install-recommends --download-only fluidsynth ffmpeg libarchive-tools && break
            echo "The package download stalled (attempt $attempt); starting again"
          done
          sudo apt-get install -y --no-install-recommends fluidsynth ffmpeg libarchive-tools
      - name: Install FluidSynth and FFmpeg (macOS)
        if: runner.os == 'macOS'
        run: brew install fluid-synth ffmpeg
      - name: Install the Python packages
        # requirements.txt pins NumPy by hash, which puts pip in hash-checking mode for everything that command
        # installs; the test tools go in a command of their own.
        run: |
          python -m pip install -r skills/music-production/requirements.txt
          python -m pip install pyyaml pytest
      - name: Set up the renderer with the system tools
        if: runner.os != 'Windows'
        run: python skills/music-production/scripts/bootstrap.py --system --runtime "$RUNNER_TEMP/runtime" --config "$RUNNER_TEMP/runtime/local-config.json"
      - name: Set up the renderer with the pinned portable tools and Surge XT (Windows)
        if: runner.os == 'Windows'
        run: python skills/music-production/scripts/bootstrap.py --runtime "$RUNNER_TEMP/runtime" --config "$RUNNER_TEMP/runtime/local-config.json"
      - name: Compile every script
        run: python -m compileall -q skills tests examples
      - name: Run the tests, renders included
        env:
          MUSIC_SKILL_CONFIG: ${{ runner.temp }}/runtime/local-config.json
          # A loop's Ogg Vorbis copy is optional for users; here it is required, so a missing encoder fails the run.
          # Not on macOS: Homebrew's ffmpeg lacks the libvorbis encoder (ffmpeg-full has it), so there the loop test notes
          # the copy as skipped, as it does for users with that FFmpeg.
          MUSIC_SKILL_REQUIRE_OGG: ${{ runner.os != 'macOS' && '1' || '' }}
          # Surge XT is optional for users too; the Windows job installs it, so there a setup that came out without it
          # fails the run instead of passing on the built-in fallback.
          MUSIC_SKILL_REQUIRE_SURGE: ${{ runner.os == 'Windows' && '1' || '' }}
        run: python -m pytest -q tests
