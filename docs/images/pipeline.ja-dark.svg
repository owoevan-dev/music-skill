<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="書く、チェック、演奏、レンダリング、ミックス、計測"><g font-family="-apple-system, Segoe UI, Helvetica, Arial, Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif" text-anchor="middle"><rect x="18" y="34" width="164" height="58" rx="9" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2.5"/><text x="100.0" y="70" font-size="21" font-weight="600" fill="#0d1117">書く</text><text x="100.0" y="120" font-size="15" fill="#9a9a9a">すべての音をエージェントが</text><path d="M188 63 L210 63 M203 56 L211 63 L203 70" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="34" width="164" height="58" rx="9" fill="none" stroke="#f0f0f0" stroke-width="2.5"/><text x="300.0" y="70" font-size="21" font-weight="600" fill="#f0f0f0">チェック</text><text x="300.0" y="120" font-size="15" fill="#9a9a9a">音を出す前に譜面を</text><path d="M388 63 L410 63 M403 56 L411 63 L403 70" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="418" y="34" width="164" height="58" rx="9" fill="none" stroke="#f0f0f0" stroke-width="2.5"/><text x="500.0" y="70" font-size="21" font-weight="600" fill="#f0f0f0">演奏</text><text x="500.0" y="120" font-size="15" fill="#9a9a9a">奏者のように</text><path d="M588 63 L610 63 M603 56 L611 63 L603 70" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="618" y="34" width="164" height="58" rx="9" fill="#f0f0f0" stroke="#f0f0f0" stroke-width="2.5"/><text x="700.0" y="70" font-size="21" font-weight="600" fill="#0d1117">レンダリング</text><text x="700.0" y="120" font-size="15" fill="#9a9a9a">実際の録音で</text><path d="M788 63 L810 63 M803 56 L811 63 L803 70" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="34" width="164" height="58" rx="9" fill="none" stroke="#f0f0f0" stroke-width="2.5"/><text x="900.0" y="70" font-size="21" font-weight="600" fill="#f0f0f0">ミックス</text><text x="900.0" y="120" font-size="15" fill="#9a9a9a">バスとリバーブ</text><path d="M988 63 L1010 63 M1003 56 L1011 63 L1003 70" fill="none" stroke="#f0f0f0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1018" y="34" width="164" height="58" rx="9" fill="none" stroke="#f0f0f0" stroke-width="2.5"/><text x="1100.0" y="70" font-size="21" font-weight="600" fill="#f0f0f0">計測</text><text x="1100.0" y="120" font-size="15" fill="#9a9a9a">そして手直し</text></g></svg>
