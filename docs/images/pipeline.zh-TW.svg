<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="寫譜、檢查、演奏、渲染、混音、量測"><g font-family="-apple-system, Segoe UI, Helvetica, Arial, Noto Sans CJK TC, Noto Sans CJK JP, Noto Sans CJK KR, sans-serif" text-anchor="middle"><rect x="18" y="34" width="164" height="58" rx="9" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="100.0" y="70" font-size="21" font-weight="600" fill="#ffffff">寫譜</text><text x="100.0" y="120" font-size="15" fill="#6a6a6a">每個音都由 agent 寫</text><path d="M188 63 L210 63 M203 56 L211 63 L203 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="218" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="300.0" y="70" font-size="21" font-weight="600" fill="#111111">檢查</text><text x="300.0" y="120" font-size="15" fill="#6a6a6a">出聲前先查樂譜</text><path d="M388 63 L410 63 M403 56 L411 63 L403 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="418" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="500.0" y="70" font-size="21" font-weight="600" fill="#111111">演奏</text><text x="500.0" y="120" font-size="15" fill="#6a6a6a">像樂手那樣</text><path d="M588 63 L610 63 M603 56 L611 63 L603 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="618" y="34" width="164" height="58" rx="9" fill="#111111" stroke="#111111" stroke-width="2.5"/><text x="700.0" y="70" font-size="21" font-weight="600" fill="#ffffff">渲染</text><text x="700.0" y="120" font-size="15" fill="#6a6a6a">用真實取樣</text><path d="M788 63 L810 63 M803 56 L811 63 L803 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="818" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="900.0" y="70" font-size="21" font-weight="600" fill="#111111">混音</text><text x="900.0" y="120" font-size="15" fill="#6a6a6a">匯流排與殘響</text><path d="M988 63 L1010 63 M1003 56 L1011 63 L1003 70" fill="none" stroke="#111111" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1018" y="34" width="164" height="58" rx="9" fill="none" stroke="#111111" stroke-width="2.5"/><text x="1100.0" y="70" font-size="21" font-weight="600" fill="#111111">量測</text><text x="1100.0" y="120" font-size="15" fill="#6a6a6a">再修改</text></g></svg>
